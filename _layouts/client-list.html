---
layout: default
bodyClass: "page-client-list"
---

<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
    <div class="row justify-content-start">
        <div class="service service-single">
            <h1 class="title">{{page.title}}</h1>
            <h2>Some of Our Very Satisfied Customers:</h2>
            <div class="content">
                {% assign clients = site.data.clients.clients | sort: 'img' | reverse %}
                <div class="grid grid-cols-3 gap-4">
                    {% for client in clients %}
                    <div class="card" style="max-width: 28rem;">
                      {% if client.img != "" %}
                      <img class="card-img-top" src="{{ client.img }}" alt="{{ client.name }}">
                      {% endif %}
                      <div class="card-body">
                        <p class="card-text">{{ client.name }}</p>
                      </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div
</div>
