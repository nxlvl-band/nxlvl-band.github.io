baseurl: '/'
permalink: pretty
title: 'The Next Level Band'

logo:
  mobile: "images/logo/minimal-logo.png"
  mobile_height: "64px"
  mobile_width: "64px"
  desktop: "images/logo/minimal-logo.png"
  desktop_height: "32px"
  desktop_width: "120px"

home: 
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
  event-tips:
    output: true

defaults:
  - scope:
      path: ""
      type: "event-tips"
    values:
      layout: "event-tips"

sass:
  style: compressed # possible values: nested expanded compact compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
